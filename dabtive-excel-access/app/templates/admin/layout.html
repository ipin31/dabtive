{% extends "base.html" %}
{% block body_class %}admin-body{% endblock %}
{% block body %}
<div class="admin-shell">
  <aside class="sidebar">
    <a class="brand sidebar-brand" href="/admin"><span class="brand-mark">D</span><span>DABTIVE</span></a>
    <div class="sidebar-label">CONTROL PANEL</div>
    <nav>
      <a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}"><span>01</span>Dashboard</a>
      <a href="/admin/campaigns/new" class="{% if 'campaigns/new' in request.url.path %}active{% endif %}"><span>02</span>Upload File</a>
      <a href="/admin/settings" class="{% if request.url.path == '/admin/settings' %}active{% endif %}"><span>03</span>Homepage</a>
      <a href="/admin/leads.xlsx"><span>04</span>Export Leads</a>
      <a href="/" target="_blank"><span>05</span>Public Page</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="server-dot"><i></i>SERVER ONLINE</div>
      <form method="post" action="/admin/logout"><input type="hidden" name="_csrf" value="{{ csrf }}"><button class="logout-btn">Logout</button></form>
    </div>
  </aside>
  <main class="admin-main">{% block admin_content %}{% endblock %}</main>
</div>
{% endblock %}
